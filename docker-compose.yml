services:
  postgres:
    image: postgres:16
    container_name: cabin-security-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cabin_control
    ports:
      - "5432:5432"
    volumes:
      - cabin_security_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cabin_control"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  cabin_security_postgres_data:
