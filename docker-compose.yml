services:
  db:
    image: postgres:16-alpine
    container_name: cabin_security_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cabin_security}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-cabin_security}"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    image: amarpatil/cabin-security-api:1.0
    container_name: cabin_security_api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-cabin_security}
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
volumes:
  postgres_data:
